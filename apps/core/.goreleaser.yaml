# Release build for apps/core (design §15). Run by .github/workflows/release.yml
# when a v* tag is pushed; try it locally with:
#   goreleaser release --snapshot --clean   (in apps/core, after `wok build web`)
# Archive names are what internal/update looks for: <binary>_<version>_<os>_<arch>.
version: 2
project_name: sous

# macOS signing (docs/guides/macos-signing-and-permissions.md): the hook below
# re-signs darwin binaries with the local self-signed "Sous Dev Signing"
# identity, which only means something on the developer's own Mac (a local
# snapshot used to test updates). It is a no-op where it cannot apply:
#   - on Linux (the release workflow runs on ubuntu-latest) the script exits at once;
#   - non-Mach-O targets are skipped;
#   - with CI set, signing is off unless SOUS_SIGN says otherwise.
# So published darwin archives keep the Go linker's ad-hoc signature. No
# certificate, keychain or path from this machine is part of the release.
# On a Mac without the identity a local snapshot fails with instructions;
# SOUS_SIGN=off goreleaser release --snapshot --clean skips signing.
builds:
  - id: sous
    main: ./cmd/sous
    binary: sous
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/XiaoXianThis/Sous/apps/core/internal/version.Version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    hooks:
      post:
        - cmd: sh scripts/sign-darwin.sh "{{ .Path }}"
          output: true
  - id: sous-hub
    main: ./cmd/sous-hub
    binary: sous-hub
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/XiaoXianThis/Sous/apps/core/internal/version.Version={{ .Tag }}"]
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: sous
    ids: [sous]
    name_template: "sous_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [none*]
  - id: sous-hub
    ids: [sous-hub]
    name_template: "sous-hub_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      # The Hub serves the PWA from web/ next to it (web_dir in hub.yaml).
      - src: ../../build/web/*.*
        dst: web
        strip_parent: true
      - src: ../../build/web/assets/*
        dst: web/assets
        strip_parent: true
      - src: configs/hub.example.yaml
        strip_parent: true
      - src: ../../work/infra/deploy/hub/*
        dst: deploy
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  draft: false
  prerelease: auto
