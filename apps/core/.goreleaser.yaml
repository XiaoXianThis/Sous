# Release build for apps/core (design §15). Run by .github/workflows/release.yml
# when a v* tag is pushed; try it locally with:
#   goreleaser release --snapshot --clean   (in apps/core, after `wok build web`)
# Archive names are what internal/update looks for: <binary>_<version>_<os>_<arch>.
version: 2
project_name: sous

# macOS signing (decision 0026, docs/guides/macos-signing-and-permissions.md):
# the hook below re-signs darwin binaries with the self-signed "Sous Dev Signing"
# identity before they are archived, so archives and checksums.txt hold the
# signed files. Where it cannot apply it does nothing:
#   - on Linux and Windows hosts the script exits at once;
#   - non-Mach-O targets (the Linux and Windows builds) are skipped;
#   - with CI set, signing is off unless SOUS_SIGN says otherwise.
# The release workflow runs on macOS with SOUS_SIGN=require and
# SOUS_SIGN_KEYCHAIN pointing at a throwaway keychain it fills from the
# repository secrets, so published darwin binaries carry the same designated
# requirement as local builds. Locally the identity comes from
# ~/Library/Keychains/sous-signing.keychain-db; on a Mac without it a snapshot
# fails with instructions, and SOUS_SIGN=off skips signing.
builds:
  - id: sous
    main: ./cmd/sous
    binary: sous
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/XiaoXianThis/Sous/apps/core/internal/version.Version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    hooks:
      post:
        - cmd: sh scripts/sign-darwin.sh "{{ .Path }}"
          output: true
  - id: sous-relay
    main: ./cmd/sous-relay
    binary: sous-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/XiaoXianThis/Sous/apps/core/internal/version.Version={{ .Tag }}"]
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: sous
    ids: [sous]
    name_template: "sous_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [none*]
  - id: sous-relay
    ids: [sous-relay]
    name_template: "sous-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      # The Hub serves the PWA from web/ next to it (web_dir in hub.yaml).
      - src: ../../build/web/*.*
        dst: web
        strip_parent: true
      - src: ../../build/web/assets/*
        dst: web/assets
        strip_parent: true
      - src: configs/hub.example.yaml
        strip_parent: true
      - src: ../../work/infra/deploy/hub/*
        dst: deploy
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  draft: false
  prerelease: auto
